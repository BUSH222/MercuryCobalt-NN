name: Docker deployment

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build and start under production restrictions
        run: docker compose up -d --build --wait --wait-timeout 60
      - name: Verify HTTP serving and update caching
        shell: python
        run: |
          import re
          from urllib.error import HTTPError
          from urllib.request import urlopen

          base = "http://127.0.0.1:8080"
          with urlopen(base + "/healthz", timeout=5) as response:
              assert response.read() == b"ok\n"
          with urlopen(base + "/", timeout=5) as response:
              html = response.read()
              assert response.headers["Cache-Control"] == "no-cache"
          with urlopen(base + "/nested/client/route", timeout=5) as response:
              assert response.read() == html
              assert response.headers["Cache-Control"] == "no-cache"
          asset = re.search(rb'src="(/assets/[^" ]+\.js)"', html)
          assert asset, "Missing built JavaScript entry"
          with urlopen(base + asset[1].decode(), timeout=5) as response:
              assert "immutable" in response.headers["Cache-Control"]
              assert "javascript" in response.headers["Content-Type"]
          try:
              urlopen(base + "/assets/missing.js", timeout=5)
          except HTTPError as error:
              assert error.code == 404
          else:
              raise AssertionError("Missing asset must return 404")
      - name: Container diagnostics
        if: always()
        run: |
          docker compose ps
          docker compose logs --tail=100
      - name: Clean up
        if: always()
        run: docker compose down
